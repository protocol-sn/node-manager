# fly.toml app configuration file generated for node-manager on 2025-09-14T09:34:57-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'node-manager'
primary_region = 'ord'

[build]
dockerfile = 'Dockerfile.fly'

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = true
auto_start_machines = true
min_machines_running = 0
processes = ['app']

[[services]]
protocol = 'tcp'
internal_port = 50051
force_https = false

[[services.ports]]
port = 50051
handlers = []
force_https = false

[[vm]]
memory = '1gb'
cpu_kind = 'shared'
cpus = 1
